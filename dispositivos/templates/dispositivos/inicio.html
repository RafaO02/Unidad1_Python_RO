<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos</title>
</head>
<body>
<ul>
    {% for d in dispositivos %}
        <li>{{ d.nombre }} - {{ d.categoria }} {{ d.categoria.estado }}</li>

    {% endfor %}
</ul>
</body>
</html>
