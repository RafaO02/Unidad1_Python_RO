<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .dashboard-header { background: #212529; color: #fff; padding: 1rem 2rem; }
        .card { box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 10px; }
        .card-header { background: #f1f3f4; font-weight: 600; }
        .footer { background: #212529; color: #fff; padding: 0.5rem 2rem; margin-top: 2rem; }
        .btn-back {
            background: none;
            color: #0d6efd;
            border: none;
            font-weight: 500;
            text-decoration: underline;
            padding: 0;
        }
        .btn-back:hover {
            color: #0a58ca;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="dashboard-header d-flex justify-content-between align-items-center">
        <div>
            <span class="fs-4 fw-bold">EcoEnergy</span>
        </div>
    </div>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <span class="fw-bold">Registro de empresa</span>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                        </form>
                        <div class="mt-3 d-flex justify-content-between">
                            <a href="{% url 'login' %}" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
                        </div>
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success mt-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        {% if form.errors %}
                            <div class="alert alert-danger mt-3">
                                Por favor corrige los errores e intenta de nuevo.
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer d-flex justify-content-between align-items-center mt-4">
        <span>&copy; 2025 EcoEnergy</span>
        <span>Soporte</span>
    </div>
</body>
</html>
